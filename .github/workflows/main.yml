name: Build iOS IPA (unsigned, manual)

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "CFBundleShortVersionString"
        required: true
        default: "1.0.0"
        type: string
      build_number:
        description: "CFBundleVersion"
        required: true
        default: "1"
        type: string
      bundle_id:
        description: "Bundle Identifier"
        required: true
        default: "com.Twoo.Catnip"
        type: string
      configuration:
        description: "Build configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug

jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-15

    env:
      SCHEME: Catnip
      BUNDLE_ID: ${{ inputs.bundle_id }}
      MARKETING_VERSION: ${{ inputs.marketing_version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      CONFIG: ${{ inputs.configuration }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show context
        run: |
          echo "Triggered by : ${{ github.actor }}"
          echo "Bundle ID    : $BUNDLE_ID"
          echo "Version      : $MARKETING_VERSION ($BUILD_NUMBER)"
          echo "Configuration: $CONFIG"
          xcodebuild -version

      - name: Install XcodeGen & xcbeautify
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: |
          cat > project.yml <<YML
          name: Catnip
          options:
            deploymentTarget:
              iOS: "15.0"
            createIntermediateGroups: true
          targets:
            Catnip:
              type: application
              platform: iOS
              sources:
                - main.swift
                - Models.swift
                - Storage.swift
                - UI.swift
                - Editor.swift
                - EditorSidebar.swift
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
                  MARKETING_VERSION: ${MARKETING_VERSION}
                  CURRENT_PROJECT_VERSION: ${BUILD_NUMBER}
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_CFBundleDisplayName: Catnip
                  INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
                  INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
                  SWIFT_VERSION: 5.9
                  TARGETED_DEVICE_FAMILY: "1,2"
          YML
          xcodegen generate

      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Catnip.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIG" \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build | xcbeautify

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/${CONFIG}-iphoneos/Catnip.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Không tìm thấy .app tại $APP_PATH"
            find build/Build/Products -maxdepth 2 -type d -name "*.app"
            exit 1
          fi
          echo "✅ Tìm thấy: $APP_PATH"

          OUT_NAME="Catnip-${MARKETING_VERSION}-${BUILD_NUMBER}-unsigned.ipa"
          rm -rf Payload "$OUT_NAME"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          rm -rf Payload/Catnip.app/_CodeSignature Payload/Catnip.app/embedded.mobileprovision
          zip -qry "$OUT_NAME" Payload
          echo "=== IPA info ==="
          ls -lh "$OUT_NAME"

          echo "IPA_NAME=$OUT_NAME" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Catnip-ipa-${{ inputs.marketing_version }}-${{ inputs.build_number }}
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload dSYM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Catnip-dSYM-${{ inputs.marketing_version }}-${{ inputs.build_number }}
          path: build/Build/Products/${{ inputs.configuration }}-iphoneos/Catnip.app.dSYM
          if-no-files-found: ignore

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/Logs/
          if-no-files-found: ignore