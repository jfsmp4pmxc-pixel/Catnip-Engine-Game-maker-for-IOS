name: Build iOS IPA (unsigned, manual)

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "CFBundleShortVersionString"
        required: true
        default: "1.0.0"
        type: string
      build_number:
        description: "CFBundleVersion"
        required: true
        default: "1"
        type: string
      bundle_id:
        description: "Bundle Identifier"
        required: true
        default: "com.Twoo.Catnip"
        type: string
      configuration:
        description: "Build configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug
      with_love:
        description: "Nhúng lõi LÖVE (nút Chạy). Tắt nếu cần build nhanh chỉ phần editor"
        required: true
        default: true
        type: boolean

jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-15

    env:
      SCHEME: Catnip
      BUNDLE_ID: ${{ inputs.bundle_id }}
      MARKETING_VERSION: ${{ inputs.marketing_version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      CONFIG: ${{ inputs.configuration }}
      WITH_LOVE: ${{ inputs.with_love }}
      # Bản LÖVE đã kiểm chứng build được (xem workflow love-core.yml)
      LOVE_REF: ef388d4371f5932491fbdcdd65ac7240e11c31a8
      DEPS_REF: a5522634f1e581a1ebab73bf3ab4bd7a853b7a3e

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show context
        run: |
          echo "Triggered by : ${{ github.actor }}"
          echo "Bundle ID    : $BUNDLE_ID"
          echo "Version      : $MARKETING_VERSION ($BUILD_NUMBER)"
          echo "Configuration: $CONFIG"
          xcodebuild -version

      - name: Install XcodeGen & xcbeautify
        run: brew install xcodegen xcbeautify

      - name: Build LOVE core (liblove.a)
        if: ${{ inputs.with_love }}
        run: |
          set -e
          fetch() { # url dir ref
            git init -q "$2"
            git -C "$2" remote add origin "$1"
            git -C "$2" fetch -q --depth 1 origin "$3"
            git -C "$2" checkout -q FETCH_HEAD
          }
          fetch https://github.com/love2d/love love "$LOVE_REF"
          fetch https://github.com/love2d/love-apple-dependencies deps "$DEPS_REF"
          cp -R deps/iOS/libraries love/platform/xcode/ios/
          cp -R deps/shared love/platform/xcode/
          set -o pipefail
          xcodebuild \
            -project love/platform/xcode/liblove.xcodeproj \
            -target liblove-ios \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build-love" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | xcbeautify
          ls -lh build-love/Release-iphoneos/liblove.a

      - name: Generate Xcode project
        run: |
          LOVE_DIR="$PWD/love"
          LOVE_LIB="$PWD/build-love/Release-iphoneos/liblove.a"
          LOVE_XC="$LOVE_DIR/platform/xcode"
          {
          cat <<YML
          name: Catnip
          options:
            deploymentTarget:
              iOS: "15.0"
            createIntermediateGroups: true
          targets:
            Catnip:
              type: application
              platform: iOS
              sources:
                - main.swift
                - Models.swift
                - Storage.swift
                - UI.swift
                - Editor.swift
                - EditorSidebar.swift
                - GameRun.swift
                - Fonts.swift
                - Themes.swift
                - MarkdownPreview.swift
                - path: Resources
                  buildPhase: resources
          YML
          if [ "$WITH_LOVE" = "true" ]; then
          cat <<YML
                - LoveBridge.mm
                - LoveBridge.h
                - Catnip-Bridging-Header.h
          YML
          fi
          cat <<YML
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
                  MARKETING_VERSION: ${MARKETING_VERSION}
                  CURRENT_PROJECT_VERSION: ${BUILD_NUMBER}
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_CFBundleDisplayName: Catnip
                  INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
                  INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
                  INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
                  SWIFT_VERSION: 5.9
                  TARGETED_DEVICE_FAMILY: "1,2"
          YML
          if [ "$WITH_LOVE" = "true" ]; then
          cat <<YML
                  SWIFT_OBJC_BRIDGING_HEADER: Catnip-Bridging-Header.h
                  SWIFT_ACTIVE_COMPILATION_CONDITIONS: "\$(inherited) CATNIP_HAS_LOVE"
                  CLANG_CXX_LANGUAGE_STANDARD: c++17
                  CLANG_CXX_LIBRARY: libc++
                  HEADER_SEARCH_PATHS: "\$(inherited) ${LOVE_DIR}/src ${LOVE_DIR}/src/libraries ${LOVE_DIR}/src/modules ${LOVE_XC}/ios/libraries/Lua.xcframework/ios-arm64/Headers"
                  FRAMEWORK_SEARCH_PATHS: "\$(inherited) ${LOVE_XC}/shared/Frameworks/SDL3.xcframework/ios-arm64"
                  OTHER_LDFLAGS: "\$(inherited) -ObjC ${LOVE_LIB}"
              dependencies:
                - framework: ${LOVE_XC}/shared/Frameworks/SDL3.xcframework
                  embed: true
                  codeSign: false
                - framework: ${LOVE_XC}/ios/libraries/Lua.xcframework
                  embed: false
                - framework: ${LOVE_XC}/ios/libraries/freetype.xcframework
                  embed: false
                - framework: ${LOVE_XC}/ios/libraries/harfbuzz.xcframework
                  embed: false
                - framework: ${LOVE_XC}/ios/libraries/modplug.xcframework
                  embed: false
                - framework: ${LOVE_XC}/ios/libraries/ogg.xcframework
                  embed: false
                - framework: ${LOVE_XC}/ios/libraries/theora.xcframework
                  embed: false
                - framework: ${LOVE_XC}/ios/libraries/vorbis.xcframework
                  embed: false
                - sdk: AVFoundation.framework
                - sdk: AudioToolbox.framework
                - sdk: CoreGraphics.framework
                - sdk: CoreHaptics.framework
                - sdk: CoreMotion.framework
                - sdk: GameController.framework
                - sdk: Metal.framework
                - sdk: OpenAL.framework
                - sdk: OpenGLES.framework
                - sdk: QuartzCore.framework
                - sdk: UIKit.framework
                - sdk: libz.tbd
                - sdk: libbz2.tbd
                - sdk: libc++.tbd
          YML
          fi
          } > project.yml
          echo "=== project.yml ==="
          cat project.yml
          xcodegen generate

      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Catnip.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIG" \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build | xcbeautify

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/${CONFIG}-iphoneos/Catnip.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Không tìm thấy .app tại $APP_PATH"
            find build/Build/Products -maxdepth 2 -type d -name "*.app"
            exit 1
          fi
          echo "✅ Tìm thấy: $APP_PATH"

          OUT_NAME="Catnip-${MARKETING_VERSION}-${BUILD_NUMBER}-unsigned.ipa"
          rm -rf Payload "$OUT_NAME"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          # Cho phép xem thư mục Documents (các dự án) trong app Tệp: On My iPhone > Catnip.
          PLIST="Payload/Catnip.app/Info.plist"
          for KEY in UIFileSharingEnabled LSSupportsOpeningDocumentsInPlace; do
            /usr/libexec/PlistBuddy -c "Delete :$KEY" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :$KEY bool true" "$PLIST"
          done
          rm -rf Payload/Catnip.app/_CodeSignature Payload/Catnip.app/embedded.mobileprovision
          zip -qry "$OUT_NAME" Payload
          echo "=== IPA info ==="
          ls -lh "$OUT_NAME"

          echo "IPA_NAME=$OUT_NAME" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Catnip-ipa-${{ inputs.marketing_version }}-${{ inputs.build_number }}
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload dSYM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Catnip-dSYM-${{ inputs.marketing_version }}-${{ inputs.build_number }}
          path: build/Build/Products/${{ inputs.configuration }}-iphoneos/Catnip.app.dSYM
          if-no-files-found: ignore

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/Logs/
          if-no-files-found: ignore