name: Build iOS IPA (unsigned, manual)

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "CFBundleShortVersionString"
        required: true
        default: "1.0.0"
        type: string
      build_number:
        description: "CFBundleVersion"
        required: true
        default: "1"
        type: string
      bundle_id:
        description: "Bundle Identifier"
        required: true
        default: "com.Twoo.Catnip"
        type: string
      configuration:
        description: "Build configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Preview
          - Beta
          - Debug
      with_love:
        description: "Nhúng lõi LÖVE (nút Chạy). Tắt nếu cần build nhanh chỉ phần editor"
        required: true
        default: true
        type: boolean
      with_ish:
        description: "Nhúng iSH (shell Linux thật trong cửa sổ shell). Bản đầu: nên chạy workflow 'Build iSH core' trước để kiểm tra"
        required: true
        default: false
        type: boolean

jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-15

    env:
      SCHEME: Catnip
      BUNDLE_ID: ${{ inputs.bundle_id }}
      MARKETING_VERSION: ${{ inputs.marketing_version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      CONFIG: ${{ inputs.configuration }}
      WITH_LOVE: ${{ inputs.with_love }}
      WITH_ISH: ${{ inputs.with_ish }}
      # Bản iSH dùng để nhúng (xem workflow ish-core.yml)
      ISH_REF: de5ab2c4b1039551203c1106e75f715cd917544b
      # Bản LÖVE đã kiểm chứng build được (xem workflow love-core.yml)
      LOVE_REF: ef388d4371f5932491fbdcdd65ac7240e11c31a8
      DEPS_REF: a5522634f1e581a1ebab73bf3ab4bd7a853b7a3e

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show context
        run: |
          echo "Triggered by : ${{ github.actor }}"
          echo "Bundle ID    : $BUNDLE_ID"
          echo "Version      : $MARKETING_VERSION ($BUILD_NUMBER)"
          echo "Configuration: $CONFIG"
          xcodebuild -version

      - name: Install XcodeGen & xcbeautify
        run: brew install xcodegen xcbeautify

      - name: Build LOVE core (liblove.a)
        if: ${{ inputs.with_love }}
        run: |
          set -e
          fetch() { # url dir ref
            git init -q "$2"
            git -C "$2" remote add origin "$1"
            git -C "$2" fetch -q --depth 1 origin "$3"
            git -C "$2" checkout -q FETCH_HEAD
          }
          fetch https://github.com/love2d/love love "$LOVE_REF"
          fetch https://github.com/love2d/love-apple-dependencies deps "$DEPS_REF"
          cp -R deps/iOS/libraries love/platform/xcode/ios/
          cp -R deps/shared love/platform/xcode/
          set -o pipefail
          xcodebuild \
            -project love/platform/xcode/liblove.xcodeproj \
            -target liblove-ios \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build-love" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | xcbeautify
          ls -lh build-love/Release-iphoneos/liblove.a

      - name: Build iSH core (libish*.a + rootfs)
        if: ${{ inputs.with_ish }}
        run: OUT="$PWD/ish-core" tools/build_ish_core.sh

      - name: Generate Xcode project
        run: |
          export LOVE_DIR="$PWD/love"
          export LOVE_LIB="$PWD/build-love/Release-iphoneos/liblove.a"
          export ISH_CORE="$PWD/ish-core"
          python3 tools/gen_project_yml.py > project.yml
          echo "=== project.yml ==="
          cat project.yml
          xcodegen generate

      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Catnip.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIG" \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build | xcbeautify

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/${CONFIG}-iphoneos/Catnip.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Không tìm thấy .app tại $APP_PATH"
            find build/Build/Products -maxdepth 2 -type d -name "*.app"
            exit 1
          fi
          echo "✅ Tìm thấy: $APP_PATH"

          OUT_NAME="Catnip-${MARKETING_VERSION}-${BUILD_NUMBER}-unsigned.ipa"
          rm -rf Payload "$OUT_NAME"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          # Cho phép xem thư mục Documents (các dự án) trong app Tệp: On My iPhone > Catnip.
          PLIST="Payload/Catnip.app/Info.plist"
          for KEY in UIFileSharingEnabled LSSupportsOpeningDocumentsInPlace; do
            /usr/libexec/PlistBuddy -c "Delete :$KEY" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :$KEY bool true" "$PLIST"
          done
          rm -rf Payload/Catnip.app/_CodeSignature Payload/Catnip.app/embedded.mobileprovision
          zip -qry "$OUT_NAME" Payload
          echo "=== IPA info ==="
          ls -lh "$OUT_NAME"

          echo "IPA_NAME=$OUT_NAME" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Catnip-ipa-${{ inputs.marketing_version }}-${{ inputs.build_number }}
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload dSYM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Catnip-dSYM-${{ inputs.marketing_version }}-${{ inputs.build_number }}
          path: build/Build/Products/${{ inputs.configuration }}-iphoneos/Catnip.app.dSYM
          if-no-files-found: ignore

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/Logs/
          if-no-files-found: ignore